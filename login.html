<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduQuest Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .input-field { @apply w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition; }
        .btn-primary { @apply w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-lg font-bold shadow-lg hover:shadow-xl transition transform hover:-translate-y-0.5; }
        .social-btn { @apply flex items-center justify-center space-x-3 w-full py-3 rounded-lg border border-gray-300 hover:bg-gray-50 transition font-medium; }
        .loader { border-top-color: #667eea; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="gradient-bg p-8 text-center">
            <span class="iconify text-6xl text-white mb-4 inline-block" data-icon="icon-park-solid:game-console"></span>
            <h1 class="text-2xl font-bold text-white">Welcome Back!</h1>
            <p class="text-indigo-100 mt-2">Sign in to continue your quest</p>
        </div>

        <div class="p-8">
            <!-- Error Alert -->
            <div id="error-alert" class="hidden mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded">
                <div class="flex items-center space-x-3">
                    <span class="iconify text-red-500 text-xl" data-icon="icon-park-solid:error"></span>
                    <p id="error-message" class="text-red-700 text-sm font-medium"></p>
                </div>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3.5 text-gray-400">
                            <span class="iconify text-xl" data-icon="icon-park-solid:mail"></span>
                        </span>
                        <input type="email" id="email" required class="input-field pl-10" placeholder="you@example.com">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3.5 text-gray-400">
                            <span class="iconify text-xl" data-icon="icon-park-solid:lock"></span>
                        </span>
                        <input type="password" id="password" required class="input-field pl-10" placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
                        <span class="ml-2 text-sm text-gray-600">Remember me</span>
                    </label>
                    <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">Forgot password?</a>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">
                    Sign In
                </button>
            </form>

            <div class="mt-8">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
                    <div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-gray-500">Or continue with</span></div>
                </div>

                <div class="mt-6 grid grid-cols-2 gap-3">
                    <button onclick="socialLogin('Google')" class="social-btn">
                        <span class="iconify text-xl" data-icon="icon-park-solid:google"></span>
                        <span>Google</span>
                    </button>
                    <button onclick="socialLogin('Microsoft')" class="social-btn">
                        <span class="iconify text-xl" data-icon="icon-park-solid:microsoft"></span>
                        <span>Microsoft</span>
                    </button>
                    <button onclick="socialLogin('School')" class="social-btn col-span-2">
                        <span class="iconify text-xl" data-icon="icon-park-solid:school"></span>
                        <span>School Account</span>
                    </button>
                </div>
            </div>

            <p class="mt-8 text-center text-sm text-gray-600">
                Don't have an account? 
                <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500">Contact your teacher</a>
            </p>
            
            <div class="mt-4 text-center">
                <a href="index.html" class="text-sm text-gray-500 hover:text-gray-700 flex items-center justify-center space-x-1">
                    <span class="iconify" data-icon="icon-park-solid:left"></span>
                    <span>Back to Home</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 flex items-center space-x-4">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-8 w-8"></div>
            <span class="text-gray-700 font-medium">Signing in...</span>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const errorAlert = document.getElementById('error-alert');
        const errorMsg = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');
        const loadingOverlay = document.getElementById('loading-overlay');

        function showError(msg) {
            errorMsg.textContent = msg;
            errorAlert.classList.remove('hidden');
            setTimeout(() => errorAlert.classList.add('hidden'), 5000);
        }

        function showLoading(show) {
            if(show) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="iconify inline-block animate-spin mr-2" data-icon="icon-park-solid:loading"></span> Signing in...';
                loadingOverlay.classList.remove('hidden');
            } else {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
                loadingOverlay.classList.add('hidden');
            }
        }

        async function handleLogin(email, role = 'Student') {
            showLoading(true);
            errorAlert.classList.add('hidden');

            try {
                await new Promise(r => setTimeout(r, 1500));

                const user = { email, role, id: Date.now() };
                sessionStorage.setItem('eq_user', JSON.stringify(user));

                if(role === 'Admin') window.location.href = 'admin.html';
                else window.location.href = 'index.html';

            } catch (err) {
                showError('Invalid credentials. Please try again.');
                showLoading(false);
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            let role = 'Student';
            if(email.includes('admin')) role = 'Admin';
            else if(email.includes('teacher')) role = 'Teacher';

            handleLogin(email, role);
        });

        function socialLogin(provider) {
            showError(`${provider} login coming soon!`);
        }
    </script>
</body>
</html>
